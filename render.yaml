services:
  - type: web
    name: ajgl-project
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn ajgl_project.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ajgl-db
          property: connectionString
      - key: DEBUG
        value: False

databases:
  - name: ajgl-db
    plan: free