{% extends 'core/base.html' %}

{% block title %}Connexion{% endblock %}

{% block content %}

<div class="max-w-md mx-auto">
    <div class="bg-white rounded-lg shadow-md p-6">
        <h1 class="text-2xl font-bold text-green-800 text-center mb-6">Connexion</h1>

        {% if form.errors %}
            <div class="bg-red-100 border-l-4 border-red-500 text-red-700 p-3 mb-4 rounded">
                Email ou mot de passe incorrect.
            </div>
        {% endif %}

        <form method="post" >
            {% csrf_token %}

            <div class="mb-4">
                <label class="block text-gray-700 font-semibold mb-2">Email</label>
                <input type="email" name="username" id="id_username" autocomplete="off"
                       class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:border-green-500">
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 font-semibold mb-2">Mot de passe</label>
                <input type="password" name="password" id="id_password" autocomplete="off"
                       class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:border-green-500">
            </div>

            <button type="submit" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-2 rounded-lg transition">
                Se connecter
            </button>
        </form>

        <div class="mt-4 text-center">
            <p class="text-gray-600">
                Pas encore de compte ?
                <a href="{% url 'register' %}" class="text-green-700 hover:underline">Inscrivez-vous ici</a>
            </p>
        </div>
    </div>
</div>

{% endblock %}
